name: CI

# De dataset is alleen bruikbaar als hij klopt en als een wijziging opvalt. Twee stappen: het
# stdlib-script dat de vingerafdrukken herrekent en kaders.md vergelijkt, en de tests die het volledige
# JSON Schema valideren en de aantallen en de herkomst bewaken.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # De leesversie wordt gebouwd met de gedeelde build van de organisatie. Zonder deze checkout
      # slaan de paginatests zichzelf over, en dan zou een dode link op de pagina ongemerkt blijven.
      - uses: actions/checkout@v7
        with:
          repository: security-commons-nl/.github
          path: .sitebuild
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .sitebuild/package-lock.json
      - run: npm ci --prefix .sitebuild

      # De normwijzer voegt de aanvalspaden en de kennisbank samen. Zonder deze checkouts slaan de tests
      # op de gebouwde data zichzelf over.
      - uses: actions/checkout@v7
        with:
          repository: security-commons-nl/aanvalspaden
          path: _aanvalspaden
      - uses: actions/checkout@v7
        with:
          repository: security-commons-nl/kennisbank
          path: _kennisbank

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installeren
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema
      - name: Vingerafdrukken en kaders.md kloppen
        run: python tools/controleer.py --check
      - name: Tests
        run: python -m pytest tests/ -v
